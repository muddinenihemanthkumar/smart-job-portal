<!DOCTYPE html>
<html>
<head>
    <title>Edit Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2>Edit Job</h2>

        <form method="POST">
            {% csrf_token %}

            <input name="title" value="{{ job.title }}" class="form-control mb-2">
            <input name="company" value="{{ job.company }}" class="form-control mb-2">
            <input name="location" value="{{ job.location }}" class="form-control mb-2">
            <input name="salary" value="{{ job.salary }}" class="form-control mb-2">

            <textarea name="description" class="form-control mb-2">{{ job.description }}</textarea>

            <button class="btn btn-primary w-100">Update Job</button>
        </form>

    </div>

</div>

</body>
</html>
