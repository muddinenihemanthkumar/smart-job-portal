<!DOCTYPE html>
<html>
<head>
    <title>Add Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2 class="mb-3">Add New Job</h2>

        <form method="POST">
            {% csrf_token %}

            <input name="title" class="form-control mb-2" placeholder="Title">
            <input name="company" class="form-control mb-2" placeholder="Company">
            <input name="location" class="form-control mb-2" placeholder="Location">
            <input name="salary" class="form-control mb-2" placeholder="Salary">

            <textarea name="description" class="form-control mb-2" placeholder="Description"></textarea>

            <button class="btn btn-success w-100">Add Job</button>
        </form>

    </div>

</div>

</body>
</html>
